<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SOSCO ELEVATE — MEB</title>

    <!-- Home-screen app icon and full-screen mode on iPhone / iPad -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a1628">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ELEVATE">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1f3c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .app-icon {
            width: 76px;
            height: 76px;
            border-radius: 22.5%;
            display: block;
            margin: 0 auto 16px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35), inset 0 0 0 0.5px rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #4a9eff;
            margin-top: 4px;
        }

        .header .subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: #6b7fa3;
            margin-top: 12px;
            text-transform: uppercase;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.06);
            border: 0.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            padding: 32px;
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            margin-bottom: 24px;
        }

        .login-card .welcome {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .login-card .welcome-sub {
            font-size: 13px;
            color: #8899b5;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #8899b5;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #6b7fa3;
            pointer-events: none;
            transition: color 0.3s;
        }

        .input-wrap:focus-within svg {
            color: #4a9eff;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px 13px 42px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 4px rgba(74, 158, 255, 0.18);
        }

        .form-group input::placeholder {
            color: #5a6a85;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8899b5;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            accent-color: #4a9eff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: #4a9eff;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #4a9eff, #2563eb);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            transition: opacity 0.3s, transform 0.2s;
        }

        .btn-signin:hover {
            opacity: 0.92;
        }

        .btn-signin:active {
            transform: scale(0.98);
        }

        .quick-access {
            margin-top: 24px;
        }

        .quick-access h3 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #6b7fa3;
            text-align: center;
            margin-bottom: 16px;
        }

        .access-buttons {
            display: flex;
            gap: 12px;
        }

        .access-btn {
            flex: 1;
            padding: 16px 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 0.5px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .access-btn:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .access-btn:active {
            transform: scale(0.96);
        }

        /* iOS-style app-icon tile */
        .icon-tile {
            width: 52px;
            height: 52px;
            border-radius: 22.5%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .icon-tile svg {
            width: 26px;
            height: 26px;
            color: #ffffff;
        }

        .tile-admin    { background: linear-gradient(180deg, #a78bfa, #6d28d9); }
        .tile-manager  { background: linear-gradient(180deg, #4a9eff, #2563eb); }
        .tile-employee { background: linear-gradient(180deg, #34d399, #059669); }

        .access-btn .role {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .access-btn .dept {
            font-size: 11px;
            color: #6b7fa3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img class="app-icon" src="icons/icon.svg" alt="SOSCO ELEVATE">
            <h1>SOSCO</h1>
            <h2>ELEVATE</h2>
            <div class="subtitle">MIDDLE EAST BRIGADE &mdash; MEB</div>
        </div>

        <div class="login-card">
            <div class="welcome">Welcome back</div>
            <div class="welcome-sub">Sign in to access your dashboard</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input id="username" type="text" placeholder="john.smith" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-signin">Sign In</button>
            </form>
        </div>

        <div class="quick-access">
            <h3>Quick Access</h3>
            <div class="access-buttons">
                <a href="#" class="access-btn">
                    <div class="icon-tile tile-admin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
                    </div>
                    <div class="role">Admin</div>
                    <div class="dept">HO &middot; MEB</div>
                </a>
                <a href="#" class="access-btn">
                    <div class="icon-tile tile-manager">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
                    </div>
                    <div class="role">Manager</div>
                    <div class="dept">WHM</div>
                </a>
                <a href="#" class="access-btn">
                    <div class="icon-tile tile-employee">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M14 6a6 6 0 0 1 6 6v3"/><path d="M4 15v-3a6 6 0 0 1 6-6"/><rect x="2" y="15" width="20" height="4" rx="1"/></svg>
                    </div>
                    <div class="role">Employee</div>
                    <div class="dept">WHM</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Sign in functionality coming soon.');
        });
    </script>
</body>
</html>
