<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SOSCO ELEVATE — MEB</title>

    <!-- Home-screen app icon and full-screen mode on iPhone / iPad -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ELEVATE">

    <style>
        /* iOS system colors: grouped background, solid cards, no gradients */
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --fill: #f2f2f7;
            --separator: rgba(60, 60, 67, 0.18);
            --label: #000000;
            --label-2: rgba(60, 60, 67, 0.6);
            --label-3: rgba(60, 60, 67, 0.3);
            --blue: #007aff;
            --pressed: #e5e5ea;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --fill: #2c2c2e;
                --separator: rgba(84, 84, 88, 0.6);
                --label: #ffffff;
                --label-2: rgba(235, 235, 245, 0.6);
                --label-3: rgba(235, 235, 245, 0.3);
                --blue: #0a84ff;
                --pressed: #2c2c2e;
                color-scheme: dark;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--label);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 22.5%;
            display: block;
            margin: 0 auto 14px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            color: var(--blue);
            font-weight: 600;
        }

        .header .subtitle {
            font-size: 13px;
            color: var(--label-2);
            margin-top: 4px;
        }

        .login-card {
            background: var(--card);
            border-radius: 14px;
            padding: 24px 20px;
            margin-bottom: 28px;
        }

        .login-card .welcome {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .login-card .welcome-sub {
            font-size: 15px;
            color: var(--label-2);
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--label-2);
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--label-2);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: var(--fill);
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--label);
            font-family: inherit;
            font-size: 17px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--blue);
        }

        .form-group input::placeholder {
            color: var(--label-3);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 20px;
            font-size: 15px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--label);
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            accent-color: var(--blue);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--blue);
            text-decoration: none;
            font-size: 15px;
        }

        .btn-signin {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-signin:active {
            opacity: 0.7;
        }

        .quick-access h3 {
            font-size: 13px;
            font-weight: 400;
            text-transform: uppercase;
            color: var(--label-2);
            margin: 0 0 8px 16px;
        }

        /* iOS grouped list, like the Settings app */
        .access-buttons {
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
        }

        .access-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            position: relative;
        }

        .access-btn + .access-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 62px;
            right: 0;
            border-top: 0.5px solid var(--separator);
        }

        .access-btn:active {
            background: var(--pressed);
        }

        .access-btn .text {
            flex: 1;
        }

        .access-btn .chevron {
            width: 8px;
            height: 14px;
            color: var(--label-3);
        }

        /* iOS-style app-icon tile */
        .icon-tile {
            width: 32px;
            height: 32px;
            border-radius: 22.5%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-tile svg {
            width: 20px;
            height: 20px;
            color: #ffffff;
        }

        .tile-admin    { background: #af52de; }
        .tile-manager  { background: #007aff; }
        .tile-employee { background: #34c759; }

        .access-btn .role {
            font-size: 17px;
            color: var(--label);
        }

        .access-btn .dept {
            font-size: 13px;
            color: var(--label-2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img class="app-icon" src="icons/icon.svg" alt="SOSCO ELEVATE">
            <h1>SOSCO <span>Elevate</span></h1>
            <div class="subtitle">Middle East Brigade &middot; MEB</div>
        </div>

        <div class="login-card">
            <div class="welcome">Welcome back</div>
            <div class="welcome-sub">Sign in to access your dashboard</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input id="username" type="text" placeholder="john.smith" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-signin">Sign In</button>
            </form>
        </div>

        <div class="quick-access">
            <h3>Quick Access</h3>
            <div class="access-buttons">
                <a href="#" class="access-btn">
                    <div class="icon-tile tile-admin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
                    </div>
                    <div class="text">
                        <div class="role">Admin</div>
                        <div class="dept">HO &middot; MEB</div>
                    </div>
                    <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
                </a>
                <a href="#" class="access-btn">
                    <div class="icon-tile tile-manager">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
                    </div>
                    <div class="text">
                        <div class="role">Manager</div>
                        <div class="dept">WHM</div>
                    </div>
                    <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
                </a>
                <a href="#" class="access-btn">
                    <div class="icon-tile tile-employee">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M14 6a6 6 0 0 1 6 6v3"/><path d="M4 15v-3a6 6 0 0 1 6-6"/><rect x="2" y="15" width="20" height="4" rx="1"/></svg>
                    </div>
                    <div class="text">
                        <div class="role">Employee</div>
                        <div class="dept">WHM</div>
                    </div>
                    <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Sign in functionality coming soon.');
        });
    </script>
</body>
</html>
